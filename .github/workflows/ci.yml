name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      # tests/test_serp_sim.py, tests/test_policies.py and tests/test_calibration.py
      # need data/processed/bookings_legs.parquet, which is built from the Aviasales
      # raw feeds in data/raw/ — those are gitignored and unavailable in CI, so the
      # artifact cannot be regenerated here. Everything else runs green.
      - name: Run tests
        run: >-
          uv run pytest -q
          --ignore=tests/test_serp_sim.py
          --ignore=tests/test_policies.py
          --ignore=tests/test_calibration.py
